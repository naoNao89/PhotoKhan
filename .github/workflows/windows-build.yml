name: windows-build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 300
    env:
      # ort-sys static-link contract (2.0.0-rc.15): ORT_LIB_PATH must point at the
      # directory containing Release\ (onnxruntime_*.lib) and _deps\ (externals).
      ORT_LIB_PATH: 'D:\build\onnxruntime\build\Windows\Release'
      ORT_LIB_PROFILE: 'Release'
      ORT_PREFER_DYNAMIC_LINK: '0'
      # Fail the link instead of silently downloading the prebuilt DLL when the
      # static tree is misconfigured.
      ORT_SKIP_DOWNLOAD: '1'
      RUST_BACKTRACE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: A - Environment (toolchains, MSVC, ORT env)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          rustc -V
          cargo -V
          node -v
          npm -v
          cmake --version
          python --version

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe not found - Visual Studio Installer missing' }
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw 'MSVC (VC.Tools.x86.x64) not found via vswhere' }
          $cl = Get-ChildItem -Path (Join-Path $vsPath 'VC\Tools\MSVC') -Recurse -File -Filter 'cl.exe' -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          if (-not $cl) { throw 'cl.exe not found under VC\Tools\MSVC' }
          Write-Host "cl.exe: $($cl.FullName)"
          $clBanner = (& $cl.FullName 2>&1 | Select-Object -First 1)
          $LASTEXITCODE = 0
          Write-Host "cl: $clBanner"

          Write-Host 'ORT env:'
          Write-Host "  ORT_LIB_PATH=$env:ORT_LIB_PATH"
          Write-Host "  ORT_LIB_PROFILE=$env:ORT_LIB_PROFILE"
          Write-Host "  ORT_PREFER_DYNAMIC_LINK=$env:ORT_PREFER_DYNAMIC_LINK"
          Write-Host "  ORT_SKIP_DOWNLOAD=$env:ORT_SKIP_DOWNLOAD"

      - name: B1 - Rust toolchain 1.92.0 (pinned, rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'
          components: rustfmt

      - name: B2b - Rust dependency cache (target + ~/.cargo)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'dll'
          cache-on-failure: 'true'
          # rustc's default for -l static is +bundle: ort-sys's rlib COPIES the
          # onnxruntime/re2/abseil archives into the .rlib, and cargo does not
          # track their contents (only the env vars). A cached ort-sys rlib could
          # therefore embed an older SDK than the ORT tree on disk. Key the Rust
          # cache on the ORT build-script hash + the ORT link env vars so any ORT
          # tree change also invalidates the Rust cache.
          key: phk-dll-ort-${{ hashFiles('build_ort_baseline.ps1') }}
          env-vars: 'ORT_LIB_PATH ORT_LIB_PROFILE ORT_PREFER_DYNAMIC_LINK ORT_SKIP_DOWNLOAD'

      - name: B3 - cmake >= 3.28 guard
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $raw = (& cmake --version | Select-Object -First 1)
          Write-Host "cmake: $raw"
          $numeric = (($raw -replace '^cmake version\s+', '').Trim() -replace '^([0-9]+(\.[0-9]+){1,3}).*$', '$1')
          if ($numeric -and ([version]$numeric -lt [version]'3.28.0')) {
              Write-Host "cmake $numeric < 3.28 - upgrading via pip"
              python -m pip install --upgrade cmake
              if ($LASTEXITCODE -ne 0) { throw "pip cmake upgrade failed (exit $LASTEXITCODE)" }
              $scripts = python -c "import sysconfig; print(sysconfig.get_paths()['scripts'])"
              if ($LASTEXITCODE -ne 0) { throw 'failed to resolve pip Scripts dir' }
              Write-Host "Adding pip Scripts dir to PATH: $scripts"
              Add-Content -Path $env:GITHUB_PATH -Value $scripts
          } else {
              Write-Host 'cmake >= 3.28 - no upgrade needed'
          }
          cmake --version

      - name: C1 - Restore ONNX Runtime source + build tree
        id: C1
        uses: actions/cache/restore@v4
        with:
          # Whole tree, including the git clone: build_ort_baseline.ps1 refuses to
          # run when D:\build\onnxruntime exists without .git, and the CMakeCache
          # bakes in absolute source paths. Restoring the full tree makes warm
          # runs incremental (clone reuse + msbuild up-to-date).
          path: 'D:\build\onnxruntime'
          key: ort-win-static-1.31.0-${{ hashFiles('build_ort_baseline.ps1') }}
          restore-keys: |
            ort-win-static-1.31.0-

      # Run ALWAYS: a cache hit means the script reuses the tree incrementally;
      # a miss means the full ~30-90 min static build.
      - name: C2 - Build ONNX Runtime static Release (no AVX flags)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gitDir = 'D:\build\onnxruntime'
          if (Test-Path (Join-Path $gitDir '.git')) {
              # The cached clone's HEAD may carry multiple tags at the v1.31.0 commit
              # (e.g. plugin-ep-cuda/v0.3.0), which breaks the ps1's exact-tag reuse
              # guard even though the tree is correct. Verify HEAD against the tag
              # and drop any stray same-commit tags, keeping the cache key intact.
              & git -C $gitDir fetch --depth 1 origin tag v1.31.0 2>$null
              $head = (& git -C $gitDir rev-parse HEAD).Trim()
              $target = (& git -C $gitDir rev-parse 'refs/tags/v1.31.0^{commit}').Trim()
              if ($head -ne $target) { throw "cached clone HEAD $head is not v1.31.0 ($target)" }
              foreach ($t in (& git -C $gitDir tag -l)) {
                  if ($t -eq 'v1.31.0') { continue }
                  $tcommit = (& git -C $gitDir rev-parse "refs/tags/$t^{commit}" 2>$null).Trim()
                  if ($tcommit -eq $head) {
                      & git -C $gitDir tag -d $t | Out-Null
                      Write-Host "removed stray tag '$t' (same commit as v1.31.0)"
                  }
              }
              Write-Host "cached clone verified at v1.31.0 commit $head"
          }
          powershell -ExecutionPolicy Bypass -File build_ort_baseline.ps1 -BuildRoot D:\build -RepoDir D:\build\onnxruntime -LogPath D:\build\ort_build.log -SkipDumpbin
          if ($LASTEXITCODE -ne 0) { throw "build_ort_baseline.ps1 failed (exit $LASTEXITCODE) - see D:\build\ort_build.log" }
          Write-Host 'ONNX Runtime static build OK'

      - name: C2b - Bootstrap re2 static lib (idempotent, pinned to ORT deps.txt)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'D:\build\onnxruntime\build\Windows\Release\_deps\re2-build\Release\re2.lib'
          if (Test-Path $target) {
              Write-Host "re2.lib already present: $target - bootstrap skipped"
              exit 0
          }
          # ort-sys 2.0.0-rc.15 unconditionally links static re2 from this path.
          # ORT 1.31.0 pins google/re2 @ 2024-07-02 (cmake/deps.txt) but its
          # FetchContent re2 (EXCLUDE_FROM_ALL) is never built by the MSVC build.
          # re2 2024-07-02 requires abseil (find_package(absl) unless absl::base
          # exists), so build it in a wrapper project that add_subdirectory's the
          # abseil-cpp source ORT already downloaded (_deps\abseil_cpp-src, the
          # exact 20250814.0 pin) - same toolchain, Release, /MD as the ORT build.
          $re2Root = 'D:\build\re2'
          $src = Join-Path $re2Root 're2-2024-07-02'
          $build = Join-Path $re2Root 'build'
          $abslSrc = 'D:\build\onnxruntime\build\Windows\Release\_deps\abseil_cpp-src'
          if (-not (Test-Path $src)) {
              New-Item -ItemType Directory -Force -Path $re2Root | Out-Null
              & git clone --depth 1 --branch 2024-07-02 https://github.com/google/re2.git $src
              if ($LASTEXITCODE -ne 0) { throw "re2 clone failed (exit $LASTEXITCODE)" }
          }
          if (-not (Test-Path $abslSrc)) { throw "abseil_cpp-src not found at $abslSrc (ORT build must run first)" }
          # Write the wrapper with the real paths INLINED (no ${VAR} indirection):
          # a previous version passed -DABSL_SRC=.../-DRE2_SRC=... and CMake saw
          # the literal strings `$abslSrc`/`$src`, so the configure failed. Use
          # forward slashes + quotes: unquoted CMake args would mangle \b-style
          # escapes. The generated file is echoed below for diagnosis.
          $cmakeLists = Join-Path $re2Root 'CMakeLists.txt'
          $abslSrcFwd = $abslSrc.Replace('\', '/')
          $srcFwd = $src.Replace('\', '/')
          Set-Content -Path $cmakeLists -Value 'cmake_minimum_required(VERSION 3.20)'
          Add-Content -Path $cmakeLists -Value 'project(re2_bootstrap CXX)'
          Add-Content -Path $cmakeLists -Value 'set(CMAKE_CXX_STANDARD 17)'
          Add-Content -Path $cmakeLists -Value 'set(CMAKE_CXX_STANDARD_REQUIRED ON)'
          Add-Content -Path $cmakeLists -Value 'set(CMAKE_SKIP_INSTALL_RULES TRUE)'
          Add-Content -Path $cmakeLists -Value "add_subdirectory(`"$abslSrcFwd`" absl)"
          Add-Content -Path $cmakeLists -Value "add_subdirectory(`"$srcFwd`" re2)"
          Write-Host 'wrapper CMakeLists.txt:'
          Get-Content $cmakeLists
          cmake -S $re2Root -B $build -G 'Visual Studio 17 2022' -A x64 -DCMAKE_BUILD_TYPE=Release -DRE2_BUILD_TESTING=OFF
          if ($LASTEXITCODE -ne 0) { throw "re2 cmake configure failed (exit $LASTEXITCODE)" }
          cmake --build $build --config Release --parallel --target re2
          if ($LASTEXITCODE -ne 0) { throw "re2 build failed (exit $LASTEXITCODE)" }
          # add_subdirectory(${RE2_SRC} re2) places the target's output in the
          # wrapper's binary tree under the re2/ subdirectory.
          $re2Lib = Join-Path (Join-Path $build 're2') 'Release\re2.lib'
          if (-not (Test-Path $re2Lib)) { throw "re2.lib not produced at $re2Lib" }
          New-Item -ItemType Directory -Force -Path (Split-Path $target -Parent) | Out-Null
          Copy-Item $re2Lib $target -Force
          Write-Host "Bootstrap OK: $target ($((Get-Item $target).Length) bytes)"

      - name: C2c - Build EXCLUDE_FROM_ALL deps (model_package, utf8_range)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ortBuild = 'D:\build\onnxruntime\build\Windows\Release'
          # ORT's MSVC build never compiles EXCLUDE_FROM_ALL projects (same disease
          # as re2): onnxruntime_session globs core/session/model_package/*.cc and
          # links the standalone model_package subproject, and libprotobuf-lite
          # references utf8_range_*. Both stay unbuilt -> 9 unresolved externals at
          # the Rust link. Build each target explicitly and place the archives
          # where ort-sys looks.
          cmake --build $ortBuild --config Release --parallel --target model_package
          if ($LASTEXITCODE -ne 0) { throw "model_package target build failed (exit $LASTEXITCODE)" }
          $mpLib = Get-ChildItem -Path (Join-Path $ortBuild 'model_package') -Recurse -File -Filter 'model_package.lib' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $mpLib) { throw 'model_package.lib not found under the ORT build tree' }
          $mpTarget = Join-Path (Join-Path $ortBuild 'Release') 'model_package\model_package.lib'
          New-Item -ItemType Directory -Force -Path (Split-Path $mpTarget -Parent) | Out-Null
          Copy-Item $mpLib.FullName $mpTarget -Force
          Write-Host "model_package.lib -> $mpTarget"

          $pbBuild = Join-Path $ortBuild '_deps\protobuf-build'
          if (-not (Test-Path $pbBuild)) { throw "protobuf build tree missing: $pbBuild" }
          # utf8_range/utf8_validity are protobuf subprojects; the EXCLUDE_FROM_ALL
          # disease keeps them unbuilt. They live in the PARENT solution (model_package
          # proved excluded projects are there); fall back to protobuf's own solution
          # if the parent does not know the target.
          $urBuilt = $false
          cmake --build $ortBuild --config Release --parallel --target utf8_range
          if ($LASTEXITCODE -eq 0) { $urBuilt = $true }
          $pbSln = Join-Path $pbBuild 'protobuf.sln'
          if (-not $urBuilt -and (Test-Path $pbSln)) {
              cmake --build (Split-Path $pbSln) --config Release --parallel --target utf8_range
              if ($LASTEXITCODE -eq 0) { $urBuilt = $true }
          }
          if (-not $urBuilt) { throw 'utf8_range target not buildable from the parent or protobuf solution' }
          # protobuf's vendored fork emits libutf8_range.lib / libutf8_validity.lib;
          # ort-sys links the archives under their plain target names and ONLY after
          # utf8_validity resolves (static_link probes the utf8_range subdir first,
          # then the protobuf-build root). Stage both plain-name archives at both
          # probe paths and require both.
          cmake --build $ortBuild --config Release --parallel --target utf8_validity | Out-Null
          $urDir = Join-Path $pbBuild 'third_party\utf8_range'
          $urRelease = Join-Path $urDir 'Release'
          $pbRelease = Join-Path $pbBuild 'Release'
          foreach ($destDir in @($urRelease, $pbRelease)) {
              New-Item -ItemType Directory -Force -Path $destDir | Out-Null
              foreach ($target in @('utf8_range', 'utf8_validity')) {
                  $lib = Get-ChildItem -Path $urDir -Recurse -File -Filter "*$target*.lib" -ErrorAction SilentlyContinue | Select-Object -First 1
                  if ($lib) {
                      Copy-Item $lib.FullName (Join-Path $destDir "$target.lib") -Force
                      Write-Host "$target.lib staged in $destDir <- $($lib.Name)"
                  } else {
                      Write-Host "$target.lib not produced (informational)"
                  }
              }
          }
          if (-not (Test-Path (Join-Path $urRelease 'utf8_range.lib'))) { throw "utf8_range.lib missing at $urRelease" }
          if (-not (Test-Path (Join-Path $urRelease 'utf8_validity.lib'))) { throw 'utf8_validity.lib missing - ort-sys gates the utf8_range link behind it' }

      - name: C3 - Guard static-link prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $staticLib = 'D:\build\onnxruntime\build\Windows\Release\Release\onnxruntime_common.lib'
          $depsDir = 'D:\build\onnxruntime\build\Windows\Release\_deps\protobuf-build'
          if (-not (Test-Path $staticLib)) { throw "static lib missing: $staticLib" }
          if (-not (Test-Path $depsDir)) { throw "_deps build tree missing: $depsDir" }
          $re2Lib = 'D:\build\onnxruntime\build\Windows\Release\_deps\re2-build\Release\re2.lib'
          if (-not (Test-Path $re2Lib)) { throw "re2 static lib missing: $re2Lib (C2b bootstrap should have produced it)" }
          $abslBase = 'D:\build\onnxruntime\build\Windows\Release\_deps\abseil_cpp-build\absl\base\Release\absl_base.lib'
          if (-not (Test-Path $abslBase)) { throw "abseil static lib missing: $abslBase" }
          $mpLib = 'D:\build\onnxruntime\build\Windows\Release\Release\model_package\model_package.lib'
          if (-not (Test-Path $mpLib)) { throw "model_package static lib missing: $mpLib (C2c should have produced it)" }
          $urLib = 'D:\build\onnxruntime\build\Windows\Release\_deps\protobuf-build\third_party\utf8_range\Release\utf8_range.lib'
          if (-not (Test-Path $urLib)) { throw "utf8_range static lib missing: $urLib (C2c should have produced it)" }
          $uvLib = 'D:\build\onnxruntime\build\Windows\Release\_deps\protobuf-build\third_party\utf8_range\Release\utf8_validity.lib'
          if (-not (Test-Path $uvLib)) { throw "utf8_validity static lib missing: $uvLib (C2c should have produced it)" }
          Write-Host "OK: $staticLib"
          Write-Host "OK: $depsDir (protobuf externals present)"
          Write-Host "OK: $re2Lib"
          Write-Host "OK: $abslBase"
          Write-Host "OK: $mpLib"
          Write-Host "OK: $urLib"

      # Explicit save (not the default post hook): actions/cache@v4 skips its
      # post-save whenever the job fails, which would burn a full ORT rebuild on
      # every iteration. Save runs right after the ORT stage, so later failures
      # (Rust/tests) still leave a reusable tree.
      - name: C3b - Save ONNX Runtime tree (only on restore miss)
        if: steps.C1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: 'D:\build\onnxruntime'
          key: ort-win-static-1.31.0-${{ hashFiles('build_ort_baseline.ps1') }}

      - name: D - DLL crate checks (fmt, unit tests, release build)
        working-directory: dll
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo fmt --check --all
          if ($LASTEXITCODE -ne 0) { throw 'cargo fmt --check failed' }
          cargo test
          if ($LASTEXITCODE -ne 0) { throw 'cargo test failed' }
          # The dll crate release profile deliberately keeps DEFAULT unwind
          # (unlike the old Tauri app panic=abort), so catch_unwind works and
          # Rust panics are contained as PHK_ERR_PANIC - no RUSTFLAGS override.
          cargo build --release
          if ($LASTEXITCODE -ne 0) { throw 'cargo build --release failed (static ORT link via ORT_LIB_PATH)' }
          $dll = 'target\release\phk_dll.dll'
          if (-not (Test-Path $dll)) { throw "release DLL not found: $dll" }
          # Older-CPU guarantee: the DLL must contain NO AVX2/AVX-512 kernels
          # (MLAS stripped in the ORT build). Portable byte-read regex instead of
          # `strings` (not guaranteed present on Windows runners).
          $bytes = [IO.File]::ReadAllBytes($dll)
          $dllText = [Text.Encoding]::ASCII.GetString($bytes)
          $avxCount = ([regex]::Matches($dllText, '(?i)avx2|avx512')).Count
          if ($avxCount -ne 0) { throw "DLL still contains $avxCount AVX2/AVX512 symbol(s) - MLAS strip failed" }
          Write-Host "AVX2/AVX512 symbols in DLL: 0 (stripped OK)"
          Write-Host "Release DLL OK: $dll"

      - name: E - DLL bundle + smoke (self-contained, models from DLL dir)
        working-directory: dll
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = 'target\release\phk_dll.dll'
          if (-not (Test-Path $dll)) { throw "inference DLL not found: $dll" }
          $dllFull = Join-Path $PWD.Path $dll
          # static ORT check on the DLL itself (dumpbin output kept absolute so it
          # survives the working-directory).
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe not found' }
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw 'MSVC not found via vswhere' }
          $dumpbin = Get-ChildItem -Path (Join-Path $vsPath 'VC\Tools\MSVC') -Recurse -File -Filter 'dumpbin.exe' -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe not found under VC\Tools\MSVC' }
          $dllDump = Join-Path $env:GITHUB_WORKSPACE 'dll-dumpbin.txt'
          & $dumpbin.FullName /nologo /dependents $dllFull *> $dllDump
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed (exit $LASTEXITCODE)" }
          $dllDeps = Get-Content $dllDump -Raw
          if ($dllDeps -match 'onnxruntime\.dll') { throw 'phk_dll.dll imports onnxruntime.dll - ORT linked dynamically, not statically' }
          Write-Host 'OK: phk_dll.dll has no onnxruntime.dll dependency (static ORT)'
          # Real-face sample: public-domain astronaut portrait from scikit-image
          # (v0.14.2 pin - the file was removed from newer tags; data/__init__.py
          # in that tag identifies it as public domain).
          $sample = Join-Path $env:GITHUB_WORKSPACE 'astronaut.png'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/scikit-image/scikit-image/v0.14.2/skimage/data/astronaut.png' -OutFile $sample -UseBasicParsing
          if (-not (Test-Path $sample)) { throw 'failed to download astronaut.png sample' }
          # Stage a SELF-CONTAINED bundle: DLL + committed models + licenses + the
          # P/Invoke binding. The DLL crate ships NO tauri resources - the models
          # live at the repo root (models/), so they are copied from the checkout.
          # Smoke with NO env override and NO setter, so the DLL must resolve
          # models from its own directory (bundle contract).
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'photokhan-dll-bundle'
          if (Test-Path $bundle) { Remove-Item $bundle -Recurse -Force }
          New-Item -ItemType Directory -Force -Path (Join-Path $bundle 'models') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $bundle 'licenses') | Out-Null
          Copy-Item $dllFull (Join-Path $bundle 'phk_dll.dll') -Force
          foreach ($f in @('manifest.json', 'face_detection_yunet_2023mar.onnx', 'LICENSE')) {
              Copy-Item (Join-Path $env:GITHUB_WORKSPACE "models\$f") (Join-Path $bundle "models\$f") -Force
          }
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'licenses\*') (Join-Path $bundle 'licenses\') -Force
          Remove-Item Env:PHOTOKHAN_MODELS_DIR -ErrorAction SilentlyContinue
          # Interop contract: paths are UTF-8. `string`+CharSet.Ansi would use the
          # Windows code page (breaks Vietnamese filenames), and `int` capacity is
          # 32-bit vs Rust usize (64-bit). Use byte[] (NUL-terminated UTF-8) and
          # UIntPtr. The binding loads the DLL at RUNTIME via Init(dllPath)
          # (LoadLibrary + GetProcAddress into delegates) - NO DllImport path is
          # baked in, so the shipped phk-dll-smoke.cs works from any location.
          # Every concatenation is parenthesized - inside @(...) the comma binds
          # tighter than +, so '...' + $var + '...' must be one element.
          $cs = @(
              'using System;',
              'using System.Runtime.InteropServices;',
              'using System.Text;',
              'public static class PhkDll {',
              '    [DllImport("kernel32.dll", SetLastError = true, CharSet = CharSet.Unicode)]',
              '    private static extern IntPtr LoadLibrary(string lpFileName);',
              '    [DllImport("kernel32.dll", SetLastError = true, CharSet = CharSet.Ansi)]',
              '    private static extern IntPtr GetProcAddress(IntPtr hModule, string lpProcName);',
              '    private delegate int SetModelsDirFn(byte[] dir);',
              '    private delegate int ProcessFn(byte[] input, byte[] outputDir);',
              '    private delegate int LastErrorFn(byte[] buf, UIntPtr cap);',
              '    private static SetModelsDirFn _setModelsDir;',
              '    private static ProcessFn _process;',
              '    private static LastErrorFn _lastError;',
              '    public static void Init(string dllPath) {',
              '        IntPtr h = LoadLibrary(dllPath);',
              '        if (h == IntPtr.Zero) {',
              '            throw new InvalidOperationException("LoadLibrary failed: " + dllPath + " (Win32 error " + Marshal.GetLastWin32Error() + ")");',
              '        }',
              '        _setModelsDir = (SetModelsDirFn)Marshal.GetDelegateForFunctionPointer(GetProcAddress(h, "phk_set_models_dir"), typeof(SetModelsDirFn));',
              '        _process = (ProcessFn)Marshal.GetDelegateForFunctionPointer(GetProcAddress(h, "phk_process"), typeof(ProcessFn));',
              '        _lastError = (LastErrorFn)Marshal.GetDelegateForFunctionPointer(GetProcAddress(h, "phk_last_error"), typeof(LastErrorFn));',
              '    }',
              '    public static int phk_set_models_dir(byte[] dir) { return _setModelsDir(dir); }',
              '    public static int phk_process(byte[] input, byte[] outputDir) { return _process(input, outputDir); }',
              '    public static int phk_last_error(byte[] buf, UIntPtr cap) { return _lastError(buf, cap); }',
              '}'
          ) -join [Environment]::NewLine
          $csFile = Join-Path $bundle 'phk-dll-smoke.cs'
          Set-Content -Path $csFile -Value $cs
          Add-Type -Path $csFile
          function ToUtf8Z([string]$value) { [Text.Encoding]::UTF8.GetBytes($value + [char]0) }
          # Relocate the bundle to a fresh temp dir and smoke it THERE: the shipped
          # caller must work against a MOVED bundle, with models resolved from the
          # DLL own directory (no env, no setter, no baked paths).
          $moved = Join-Path $env:TEMP ('phk-bundle-' + [guid]::NewGuid().ToString('N'))
          Move-Item $bundle $moved
          [PhkDll]::Init((Join-Path $moved 'phk_dll.dll'))
          $outDir = Join-Path $moved 'out'
          if (Test-Path $outDir) { Remove-Item $outDir -Recurse -Force }
          # UTF-8 path exercise: Vietnamese filename (codepage marshalling would break this).
          $viet = Join-Path $moved 'ảnh chân dung.png'
          Copy-Item $sample $viet -Force
          $rc = [PhkDll]::phk_process((ToUtf8Z $viet), (ToUtf8Z $outDir))
          if ($rc -ne 0) {
              $buf = New-Object byte[] 1024
              [PhkDll]::phk_last_error($buf, [UIntPtr]::new(1024)) | Out-Null
              $msg = [Text.Encoding]::UTF8.GetString($buf).TrimEnd([char]0)
              throw "phk_process failed (rc $rc): $msg"
          }
          $jpg = Get-ChildItem -Path $outDir -File -Filter '*.jpg' | Select-Object -First 1
          if (-not $jpg) { throw 'phk_process returned OK but no JPG was written' }
          Add-Type -AssemblyName System.Drawing
          $img = [System.Drawing.Image]::FromFile($jpg.FullName)
          $dims = "$($img.Width)x$($img.Height)"
          $img.Dispose()
          if ($dims -ne '354x472') { throw "unexpected output dimensions: $dims (expected 354x472)" }
          Write-Host "DLL smoke OK (relocated bundle, no env/setter): $($jpg.Name) ($dims), rc=$rc"
          # Restore the bundle into the workspace for upload (upload-artifact only
          # accepts workspace paths). The smoke ran against the MOVED copy, so the
          # uploaded bundle is exactly the verified, relocated content.
          if (Test-Path $bundle) { Remove-Item $bundle -Recurse -Force -ErrorAction SilentlyContinue }
          Move-Item $moved $bundle
          $jpg = Get-ChildItem -Path (Join-Path $bundle 'out') -File -Filter '*.jpg' | Select-Object -First 1
          if (-not $jpg) { throw 'relocated bundle lost its smoke output JPG' }

          # Single-file (embedded-model) proof: ONLY phk_dll.dll in a fresh dir -
          # no models\ anywhere, no env, no setter. The DLL must verify and run the
          # embedded model (include_bytes) from memory.
          $solo = Join-Path $env:TEMP ('phk-solo-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $solo | Out-Null
          Copy-Item (Join-Path $bundle 'phk_dll.dll') (Join-Path $solo 'phk_dll.dll') -Force
          $csSoloFile = Join-Path $env:GITHUB_WORKSPACE 'phk-dll-solo-smoke.cs'
          $csSolo = @(
              'using System;',
              'using System.Runtime.InteropServices;',
              'using System.Text;',
              'public static class PhkDllSolo {',
              '    [DllImport("kernel32.dll", SetLastError = true, CharSet = CharSet.Unicode)]',
              '    private static extern IntPtr LoadLibrary(string lpFileName);',
              '    [DllImport("kernel32.dll", SetLastError = true, CharSet = CharSet.Ansi)]',
              '    private static extern IntPtr GetProcAddress(IntPtr hModule, string lpProcName);',
              '    private delegate int ProcessFn(byte[] input, byte[] outputDir);',
              '    private delegate int LastErrorFn(byte[] buf, UIntPtr cap);',
              '    private static ProcessFn _process;',
              '    private static LastErrorFn _lastError;',
              '    public static void Init(string dllPath) {',
              '        IntPtr h = LoadLibrary(dllPath);',
              '        if (h == IntPtr.Zero) { throw new InvalidOperationException("LoadLibrary failed: " + dllPath); }',
              '        _process = (ProcessFn)Marshal.GetDelegateForFunctionPointer(GetProcAddress(h, "phk_process"), typeof(ProcessFn));',
              '        _lastError = (LastErrorFn)Marshal.GetDelegateForFunctionPointer(GetProcAddress(h, "phk_last_error"), typeof(LastErrorFn));',
              '    }',
              '    public static int phk_process(byte[] input, byte[] outputDir) { return _process(input, outputDir); }',
              '    public static int phk_last_error(byte[] buf, UIntPtr cap) { return _lastError(buf, cap); }',
              '}'
          ) -join [Environment]::NewLine
          Set-Content -Path $csSoloFile -Value $csSolo
          Add-Type -Path $csSoloFile
          $soloOut = Join-Path $solo 'out'
          New-Item -ItemType Directory -Force -Path $soloOut | Out-Null
          $soloViet = Join-Path $solo 'ảnh chân dung.png'
          Copy-Item $sample $soloViet -Force
          [PhkDllSolo]::Init((Join-Path $solo 'phk_dll.dll'))
          $rcSolo = [PhkDllSolo]::phk_process((ToUtf8Z $soloViet), (ToUtf8Z $soloOut))
          if ($rcSolo -ne 0) {
              $buf = New-Object byte[] 1024
              [PhkDllSolo]::phk_last_error($buf, [UIntPtr]::new(1024)) | Out-Null
              $msgSolo = [Text.Encoding]::UTF8.GetString($buf).TrimEnd([char]0)
              throw "single-file phk_process failed (rc $rcSolo): $msgSolo"
          }
          $jpgSolo = Get-ChildItem -Path $soloOut -File -Filter '*.jpg' | Select-Object -First 1
          if (-not $jpgSolo) { throw 'single-file smoke returned OK but no JPG was written' }
          $imgSolo = [System.Drawing.Image]::FromFile($jpgSolo.FullName)
          $dimsSolo = "$($imgSolo.Width)x$($imgSolo.Height)"
          $imgSolo.Dispose()
          if ($dimsSolo -ne '354x472') { throw "unexpected single-file output dimensions: $dimsSolo (expected 354x472)" }
          Write-Host "Single-file DLL smoke OK (embedded model, no models dir): $($jpgSolo.Name) ($dimsSolo), rc=$rcSolo"
          # SHA-256: DLL + model + output JPG.
          $targets = @(
              (Join-Path $bundle 'phk_dll.dll'),
              (Join-Path $bundle 'models\face_detection_yunet_2023mar.onnx'),
              $jpg.FullName
          )
          $lines = @()
          foreach ($t in $targets) {
              if (-not (Test-Path $t)) { throw "file missing for hashing: $t" }
              $lines += ('{0}  {1}' -f (Get-FileHash -Path $t -Algorithm SHA256).Hash, $t)
          }
          $lines | Set-Content (Join-Path $env:GITHUB_WORKSPACE 'hashes.txt')
          Get-Content (Join-Path $env:GITHUB_WORKSPACE 'hashes.txt')
          # report.json (DLL-focused).
          $dllSha = (Get-FileHash (Join-Path $bundle 'phk_dll.dll') -Algorithm SHA256).Hash
          $modelSha = (Get-FileHash (Join-Path $bundle 'models\face_detection_yunet_2023mar.onnx') -Algorithm SHA256).Hash
          $manifest = Get-Content (Join-Path $bundle 'models\manifest.json') -Raw | ConvertFrom-Json
          $manifestModel = $manifest.models | Where-Object { $_.file -eq 'face_detection_yunet_2023mar.onnx' } | Select-Object -First 1
          if (-not $manifestModel) { throw 'manifest.json has no entry for face_detection_yunet_2023mar.onnx' }
          $manifestSha = $manifestModel.sha256
          if ($modelSha -ine $manifestSha) { throw "model sha256 mismatch vs manifest: $modelSha (manifest: $manifestSha)" }
          $apiCount = ([regex]::Matches($dllDeps, 'api-ms-win-[^\s,]+')).Count
          $report = [ordered]@{
              git_ref      = $env:GITHUB_REF
              git_sha      = $env:GITHUB_SHA
              run_id       = $env:GITHUB_RUN_ID
              ort_strategy = 'static'
              ort_version  = 'v1.31.0'
              dll = [ordered]@{
                  path = 'photokhan-dll-bundle\phk_dll.dll'
                  sha256 = $dllSha
              }
              model = [ordered]@{
                  sha256 = $modelSha
                  matches_manifest = $true
              }
              dumpbin = [ordered]@{
                  onnxruntime_dll_present = ($dllDeps -match 'onnxruntime\.dll')
                  msvcp140_present = ($dllDeps -match 'msvcp140\.dll')
                  api_ms_win_entries = $apiCount
              }
              smoke = [ordered]@{
                  rc = $rc
                  output_jpg = $jpg.Name
                  dimensions = $dims
                  models_resolution = 'dll_dir'
                  binding = 'init (LoadLibrary/GetProcAddress, no baked DLL path)'
                  bundle_relocated = $true
              }
              smoke_single_file = [ordered]@{
                  rc = $rcSolo
                  dimensions = $dimsSolo
                  models_resolution = 'embedded'
                  dll_only = $true
              }
              installer = [ordered]@{
                  built = $false
                  note = 'DLL-only pipeline - no Tauri app, no NSIS installer'
              }
              webview2 = 'not_applicable'
              offline = [ordered]@{
                  verified = $false
                  note = 'phk_process makes no network calls by design (local model, ORT telemetry disabled); informational only - no firewall-block proof in the DLL pipeline'
              }
          }
          $report | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $env:GITHUB_WORKSPACE 'report.json')
          Get-Content (Join-Path $env:GITHUB_WORKSPACE 'report.json')

      # Stage the ORT build log inside the workspace: upload-artifact@v4 only
      # accepts paths within the workspace.
      - name: H0 - Stage ORT build log for diagnostics
        if: always()
        shell: pwsh
        run: |
          if (Test-Path 'D:\build\ort_build.log') {
              Copy-Item 'D:\build\ort_build.log' (Join-Path $env:GITHUB_WORKSPACE 'ort_build.log') -Force
              Write-Host 'Staged D:\build\ort_build.log as ort_build.log'
          } else {
              Write-Host 'D:\build\ort_build.log not present - skipping (informational)'
          }

      # success() gate + throwing validation steps guarantee the bundle is only
      # uploaded when every assertion passed.
      - name: H1 - Upload artifacts (phk-dll-windows-x64)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phk-dll-windows-x64
          path: |
            photokhan-dll-bundle
            dll-dumpbin.txt
            report.json
            hashes.txt

      - name: H2 - Upload diagnostics (windows-build-diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics
          if-no-files-found: warn
          path: |
            report.json
            dll-dumpbin.txt
            hashes.txt
            ort_build.log
            mlas_cmake.before.txt
            mlas_cmake.after.txt
            mlas_platform.cpp
            mlas_platform.patched.cpp
