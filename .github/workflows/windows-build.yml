name: windows-build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 300
    env:
      # ort-sys static-link contract (2.0.0-rc.15): ORT_LIB_PATH must point at the
      # directory containing Release\ (onnxruntime_*.lib) and _deps\ (externals).
      ORT_LIB_PATH: 'D:\build\onnxruntime\build\Windows\Release'
      ORT_LIB_PROFILE: 'Release'
      ORT_PREFER_DYNAMIC_LINK: '0'
      # Fail the link instead of silently downloading the prebuilt DLL when the
      # static tree is misconfigured.
      ORT_SKIP_DOWNLOAD: '1'
      RUST_BACKTRACE: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: A - Environment (toolchains, MSVC, ORT env)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          rustc -V
          cargo -V
          node -v
          npm -v
          cmake --version
          python --version

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe not found - Visual Studio Installer missing' }
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw 'MSVC (VC.Tools.x86.x64) not found via vswhere' }
          $cl = Get-ChildItem -Path (Join-Path $vsPath 'VC\Tools\MSVC') -Recurse -File -Filter 'cl.exe' -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          if (-not $cl) { throw 'cl.exe not found under VC\Tools\MSVC' }
          Write-Host "cl.exe: $($cl.FullName)"
          $clBanner = (& $cl.FullName 2>&1 | Select-Object -First 1)
          $LASTEXITCODE = 0
          Write-Host "cl: $clBanner"

          Write-Host 'ORT env:'
          Write-Host "  ORT_LIB_PATH=$env:ORT_LIB_PATH"
          Write-Host "  ORT_LIB_PROFILE=$env:ORT_LIB_PROFILE"
          Write-Host "  ORT_PREFER_DYNAMIC_LINK=$env:ORT_PREFER_DYNAMIC_LINK"
          Write-Host "  ORT_SKIP_DOWNLOAD=$env:ORT_SKIP_DOWNLOAD"

      - name: B1 - Rust toolchain 1.92.0 (pinned, rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'
          components: rustfmt

      - name: B2b - Rust dependency cache (target + ~/.cargo)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'dll'
          cache-on-failure: 'true'
          # rustc's default for -l static is +bundle: ort-sys's rlib COPIES the
          # onnxruntime/re2/abseil archives into the .rlib, and cargo does not
          # track their contents (only the env vars). A cached ort-sys rlib could
          # therefore embed an older SDK than the ORT tree on disk. Key the Rust
          # cache on the ORT build-script hash + the ORT link env vars so any ORT
          # tree change also invalidates the Rust cache.
          key: phk-dll-ort-${{ hashFiles('build_ort_baseline.ps1') }}
          env-vars: 'ORT_LIB_PATH ORT_LIB_PROFILE ORT_PREFER_DYNAMIC_LINK ORT_SKIP_DOWNLOAD'

      - name: B3 - cmake >= 3.28 guard
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $raw = (& cmake --version | Select-Object -First 1)
          Write-Host "cmake: $raw"
          $numeric = (($raw -replace '^cmake version\s+', '').Trim() -replace '^([0-9]+(\.[0-9]+){1,3}).*$', '$1')
          if ($numeric -and ([version]$numeric -lt [version]'3.28.0')) {
              Write-Host "cmake $numeric < 3.28 - upgrading via pip"
              python -m pip install --upgrade cmake
              if ($LASTEXITCODE -ne 0) { throw "pip cmake upgrade failed (exit $LASTEXITCODE)" }
              $scripts = python -c "import sysconfig; print(sysconfig.get_paths()['scripts'])"
              if ($LASTEXITCODE -ne 0) { throw 'failed to resolve pip Scripts dir' }
              Write-Host "Adding pip Scripts dir to PATH: $scripts"
              Add-Content -Path $env:GITHUB_PATH -Value $scripts
          } else {
              Write-Host 'cmake >= 3.28 - no upgrade needed'
          }
          cmake --version

      - name: C1 - Restore ONNX Runtime source + build tree
        id: C1
        uses: actions/cache/restore@v4
        with:
          # Whole tree, including the git clone: build_ort_baseline.ps1 refuses to
          # run when D:\build\onnxruntime exists without .git, and the CMakeCache
          # bakes in absolute source paths. Restoring the full tree makes warm
          # runs incremental (clone reuse + msbuild up-to-date).
          path: 'D:\build\onnxruntime'
          key: ort-win-static-1.31.0-${{ hashFiles('build_ort_baseline.ps1') }}
          restore-keys: |
            ort-win-static-1.31.0-

      # Run ALWAYS: a cache hit means the script reuses the tree incrementally;
      # a miss means the full ~30-90 min static build.
      - name: C2-Baseline - Build ONNX Runtime pristine (no MLAS strip)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gitDir = 'D:\build\onnxruntime'
          if (Test-Path (Join-Path $gitDir '.git')) {
              # The cached clone's HEAD may carry multiple tags at the v1.31.0 commit
              # (e.g. plugin-ep-cuda/v0.3.0), which breaks the ps1's exact-tag reuse
              # guard even though the tree is correct. Verify HEAD against the tag
              # and drop any stray same-commit tags, keeping the cache key intact.
              & git -C $gitDir fetch --depth 1 origin tag v1.31.0 2>$null
              $head = (& git -C $gitDir rev-parse HEAD).Trim()
              $target = (& git -C $gitDir rev-parse 'refs/tags/v1.31.0^{commit}').Trim()
              if ($head -ne $target) { throw "cached clone HEAD $head is not v1.31.0 ($target)" }
              foreach ($t in (& git -C $gitDir tag -l)) {
                  if ($t -eq 'v1.31.0') { continue }
                  $tcommit = (& git -C $gitDir rev-parse "refs/tags/$t^{commit}" 2>$null).Trim()
                  if ($tcommit -eq $head) {
                      & git -C $gitDir tag -d $t | Out-Null
                      Write-Host "removed stray tag '$t' (same commit as v1.31.0)"
                  }
              }
              Write-Host "cached clone verified at v1.31.0 commit $head"
          }
          # Baseline build: pristine MLAS (AVX2/AVX512 kernels present).
          powershell -ExecutionPolicy Bypass -File build_ort_baseline.ps1 -BuildRoot D:\build -RepoDir D:\build\onnxruntime -LogPath D:\build\ort_baseline.log -SkipDumpbin -SkipStrip
          if ($LASTEXITCODE -ne 0) { throw "baseline ORT build failed (exit $LASTEXITCODE) - see D:\build\ort_baseline.log" }
          Write-Host 'ONNX Runtime baseline (pristine) static build OK'

      - name: C2b - Bootstrap re2 static lib (idempotent, pinned to ORT deps.txt)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'D:\build\onnxruntime\build\Windows\Release\_deps\re2-build\Release\re2.lib'
          if (Test-Path $target) {
              Write-Host "re2.lib already present: $target - bootstrap skipped"
              exit 0
          }
          # ort-sys 2.0.0-rc.15 unconditionally links static re2 from this path.
          # ORT 1.31.0 pins google/re2 @ 2024-07-02 (cmake/deps.txt) but its
          # FetchContent re2 (EXCLUDE_FROM_ALL) is never built by the MSVC build.
          # re2 2024-07-02 requires abseil (find_package(absl) unless absl::base
          # exists), so build it in a wrapper project that add_subdirectory's the
          # abseil-cpp source ORT already downloaded (_deps\abseil_cpp-src, the
          # exact 20250814.0 pin) - same toolchain, Release, /MD as the ORT build.
          $re2Root = 'D:\build\re2'
          $src = Join-Path $re2Root 're2-2024-07-02'
          $build = Join-Path $re2Root 'build'
          $abslSrc = 'D:\build\onnxruntime\build\Windows\Release\_deps\abseil_cpp-src'
          if (-not (Test-Path $src)) {
              New-Item -ItemType Directory -Force -Path $re2Root | Out-Null
              & git clone --depth 1 --branch 2024-07-02 https://github.com/google/re2.git $src
              if ($LASTEXITCODE -ne 0) { throw "re2 clone failed (exit $LASTEXITCODE)" }
          }
          if (-not (Test-Path $abslSrc)) { throw "abseil_cpp-src not found at $abslSrc (ORT build must run first)" }
          # Write the wrapper with the real paths INLINED (no ${VAR} indirection):
          # a previous version passed -DABSL_SRC=.../-DRE2_SRC=... and CMake saw
          # the literal strings `$abslSrc`/`$src`, so the configure failed. Use
          # forward slashes + quotes: unquoted CMake args would mangle \b-style
          # escapes. The generated file is echoed below for diagnosis.
          $cmakeLists = Join-Path $re2Root 'CMakeLists.txt'
          $abslSrcFwd = $abslSrc.Replace('\', '/')
          $srcFwd = $src.Replace('\', '/')
          Set-Content -Path $cmakeLists -Value 'cmake_minimum_required(VERSION 3.20)'
          Add-Content -Path $cmakeLists -Value 'project(re2_bootstrap CXX)'
          Add-Content -Path $cmakeLists -Value 'set(CMAKE_CXX_STANDARD 17)'
          Add-Content -Path $cmakeLists -Value 'set(CMAKE_CXX_STANDARD_REQUIRED ON)'
          Add-Content -Path $cmakeLists -Value 'set(CMAKE_SKIP_INSTALL_RULES TRUE)'
          Add-Content -Path $cmakeLists -Value "add_subdirectory(`"$abslSrcFwd`" absl)"
          Add-Content -Path $cmakeLists -Value "add_subdirectory(`"$srcFwd`" re2)"
          Write-Host 'wrapper CMakeLists.txt:'
          Get-Content $cmakeLists
          cmake -S $re2Root -B $build -G 'Visual Studio 17 2022' -A x64 -DCMAKE_BUILD_TYPE=Release -DRE2_BUILD_TESTING=OFF
          if ($LASTEXITCODE -ne 0) { throw "re2 cmake configure failed (exit $LASTEXITCODE)" }
          cmake --build $build --config Release --parallel --target re2
          if ($LASTEXITCODE -ne 0) { throw "re2 build failed (exit $LASTEXITCODE)" }
          # add_subdirectory(${RE2_SRC} re2) places the target's output in the
          # wrapper's binary tree under the re2/ subdirectory.
          $re2Lib = Join-Path (Join-Path $build 're2') 'Release\re2.lib'
          if (-not (Test-Path $re2Lib)) { throw "re2.lib not produced at $re2Lib" }
          New-Item -ItemType Directory -Force -Path (Split-Path $target -Parent) | Out-Null
          Copy-Item $re2Lib $target -Force
          Write-Host "Bootstrap OK: $target ($((Get-Item $target).Length) bytes)"

      - name: C2c - Build EXCLUDE_FROM_ALL deps (model_package, utf8_range)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ortBuild = 'D:\build\onnxruntime\build\Windows\Release'
          # ORT's MSVC build never compiles EXCLUDE_FROM_ALL projects (same disease
          # as re2): onnxruntime_session globs core/session/model_package/*.cc and
          # links the standalone model_package subproject, and libprotobuf-lite
          # references utf8_range_*. Both stay unbuilt -> 9 unresolved externals at
          # the Rust link. Build each target explicitly and place the archives
          # where ort-sys looks.
          cmake --build $ortBuild --config Release --parallel --target model_package
          if ($LASTEXITCODE -ne 0) { throw "model_package target build failed (exit $LASTEXITCODE)" }
          $mpLib = Get-ChildItem -Path (Join-Path $ortBuild 'model_package') -Recurse -File -Filter 'model_package.lib' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $mpLib) { throw 'model_package.lib not found under the ORT build tree' }
          $mpTarget = Join-Path (Join-Path $ortBuild 'Release') 'model_package\model_package.lib'
          New-Item -ItemType Directory -Force -Path (Split-Path $mpTarget -Parent) | Out-Null
          Copy-Item $mpLib.FullName $mpTarget -Force
          Write-Host "model_package.lib -> $mpTarget"

          $pbBuild = Join-Path $ortBuild '_deps\protobuf-build'
          if (-not (Test-Path $pbBuild)) { throw "protobuf build tree missing: $pbBuild" }
          # utf8_range/utf8_validity are protobuf subprojects; the EXCLUDE_FROM_ALL
          # disease keeps them unbuilt. They live in the PARENT solution (model_package
          # proved excluded projects are there); fall back to protobuf's own solution
          # if the parent does not know the target.
          $urBuilt = $false
          cmake --build $ortBuild --config Release --parallel --target utf8_range
          if ($LASTEXITCODE -eq 0) { $urBuilt = $true }
          $pbSln = Join-Path $pbBuild 'protobuf.sln'
          if (-not $urBuilt -and (Test-Path $pbSln)) {
              cmake --build (Split-Path $pbSln) --config Release --parallel --target utf8_range
              if ($LASTEXITCODE -eq 0) { $urBuilt = $true }
          }
          if (-not $urBuilt) { throw 'utf8_range target not buildable from the parent or protobuf solution' }
          # protobuf's vendored fork emits libutf8_range.lib / libutf8_validity.lib;
          # ort-sys links the archives under their plain target names and ONLY after
          # utf8_validity resolves (static_link probes the utf8_range subdir first,
          # then the protobuf-build root). Stage both plain-name archives at both
          # probe paths and require both.
          cmake --build $ortBuild --config Release --parallel --target utf8_validity | Out-Null
          $urDir = Join-Path $pbBuild 'third_party\utf8_range'
          $urRelease = Join-Path $urDir 'Release'
          $pbRelease = Join-Path $pbBuild 'Release'
          foreach ($destDir in @($urRelease, $pbRelease)) {
              New-Item -ItemType Directory -Force -Path $destDir | Out-Null
              foreach ($target in @('utf8_range', 'utf8_validity')) {
                  $lib = Get-ChildItem -Path $urDir -Recurse -File -Filter "*$target*.lib" -ErrorAction SilentlyContinue | Select-Object -First 1
                  if ($lib) {
                      Copy-Item $lib.FullName (Join-Path $destDir "$target.lib") -Force
                      Write-Host "$target.lib staged in $destDir <- $($lib.Name)"
                  } else {
                      Write-Host "$target.lib not produced (informational)"
                  }
              }
          }
          if (-not (Test-Path (Join-Path $urRelease 'utf8_range.lib'))) { throw "utf8_range.lib missing at $urRelease" }
          if (-not (Test-Path (Join-Path $urRelease 'utf8_validity.lib'))) { throw 'utf8_validity.lib missing - ort-sys gates the utf8_range link behind it' }

      - name: D1 - Build BASELINE DLL (pristine MLAS, AVX kernels present)
        working-directory: dll
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # ort-sys's rlib embeds the ORT archives (+bundle); a FULL cargo clean
          # (not `-p ort-sys` - the selector only matches workspace members, so a
          # dependency's artifacts were left stale and the DLL reused the old
          # embedded libs) guarantees this DLL embeds the PRISTINE libs built by
          # C2-Baseline.
          cargo clean
          if ($LASTEXITCODE -ne 0) { throw 'cargo clean failed' }
          cargo build --release
          if ($LASTEXITCODE -ne 0) { throw 'baseline DLL build failed' }
          $src = 'target\release\phk_dll.dll'
          if (-not (Test-Path $src)) { throw "baseline DLL not found: $src" }
          $dst = Join-Path $env:GITHUB_WORKSPACE 'phk-dll-baseline\phk_dll.dll'
          New-Item -ItemType Directory -Force -Path (Split-Path $dst -Parent) | Out-Null
          Copy-Item $src $dst -Force
          $sha = (Get-FileHash $dst -Algorithm SHA256).Hash
          Add-Content -Path $env:GITHUB_ENV -Value "PHK_BASELINE_DLL_SHA=$sha"
          Write-Host "Baseline DLL: $dst (sha256 $sha)"

      - name: C2-Strip - Rebuild ONNX Runtime with MLAS AVX2/AVX512 stripped (incremental)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -ExecutionPolicy Bypass -File build_ort_baseline.ps1 -BuildRoot D:\build -RepoDir D:\build\onnxruntime -LogPath D:\build\ort_strip.log -SkipDumpbin
          if ($LASTEXITCODE -ne 0) { throw "stripped ORT rebuild failed (exit $LASTEXITCODE) - see D:\build\ort_strip.log" }
          Write-Host 'ONNX Runtime stripped (MLAS AVX2/AVX512 removed) static build OK'

      - name: C3 - Guard static-link prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $staticLib = 'D:\build\onnxruntime\build\Windows\Release\Release\onnxruntime_common.lib'
          $depsDir = 'D:\build\onnxruntime\build\Windows\Release\_deps\protobuf-build'
          if (-not (Test-Path $staticLib)) { throw "static lib missing: $staticLib" }
          if (-not (Test-Path $depsDir)) { throw "_deps build tree missing: $depsDir" }
          $re2Lib = 'D:\build\onnxruntime\build\Windows\Release\_deps\re2-build\Release\re2.lib'
          if (-not (Test-Path $re2Lib)) { throw "re2 static lib missing: $re2Lib (C2b bootstrap should have produced it)" }
          $abslBase = 'D:\build\onnxruntime\build\Windows\Release\_deps\abseil_cpp-build\absl\base\Release\absl_base.lib'
          if (-not (Test-Path $abslBase)) { throw "abseil static lib missing: $abslBase" }
          $mpLib = 'D:\build\onnxruntime\build\Windows\Release\Release\model_package\model_package.lib'
          if (-not (Test-Path $mpLib)) { throw "model_package static lib missing: $mpLib (C2c should have produced it)" }
          $urLib = 'D:\build\onnxruntime\build\Windows\Release\_deps\protobuf-build\third_party\utf8_range\Release\utf8_range.lib'
          if (-not (Test-Path $urLib)) { throw "utf8_range static lib missing: $urLib (C2c should have produced it)" }
          $uvLib = 'D:\build\onnxruntime\build\Windows\Release\_deps\protobuf-build\third_party\utf8_range\Release\utf8_validity.lib'
          if (-not (Test-Path $uvLib)) { throw "utf8_validity static lib missing: $uvLib (C2c should have produced it)" }
          Write-Host "OK: $staticLib"
          Write-Host "OK: $depsDir (protobuf externals present)"
          Write-Host "OK: $re2Lib"
          Write-Host "OK: $abslBase"
          Write-Host "OK: $mpLib"
          Write-Host "OK: $urLib"

      # Explicit save (not the default post hook): actions/cache@v4 skips its
      # post-save whenever the job fails, which would burn a full ORT rebuild on
      # every iteration. Save runs right after the ORT stage, so later failures
      # (Rust/tests) still leave a reusable tree.
      - name: C3b - Save ONNX Runtime tree (only on restore miss)
        if: steps.C1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: 'D:\build\onnxruntime'
          key: ort-win-static-1.31.0-${{ hashFiles('build_ort_baseline.ps1') }}

      - name: D2 - Build STRIPPED DLL + diagnostics (no avxCount gate)
        working-directory: dll
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo fmt --check --all
          if ($LASTEXITCODE -ne 0) { throw 'cargo fmt --check failed' }
          cargo test
          if ($LASTEXITCODE -ne 0) { throw 'cargo test failed' }
          # Force a FULL rebuild: the ort-sys rlib embeds the ORT archives and the
          # `-p ort-sys` selector left them stale (DLLs came out byte-identical in
          # run 44532508012). Full clean guarantees the rlib embeds the STRIPPED
          # libs built by C2-Strip.
          cargo clean
          if ($LASTEXITCODE -ne 0) { throw 'cargo clean failed' }
          cargo build --release
          if ($LASTEXITCODE -ne 0) { throw 'cargo build --release failed (static ORT link via ORT_LIB_PATH)' }
          $dll = 'target\release\phk_dll.dll'
          if (-not (Test-Path $dll)) { throw "release DLL not found: $dll" }
          $dst = Join-Path $env:GITHUB_WORKSPACE 'phk-dll-stripped\phk_dll.dll'
          New-Item -ItemType Directory -Force -Path (Split-Path $dst -Parent) | Out-Null
          Copy-Item $dll $dst -Force
          $sha = (Get-FileHash $dst -Algorithm SHA256).Hash
          Add-Content -Path $env:GITHUB_ENV -Value "PHK_STRIPPED_DLL_SHA=$sha"
          # DIAGNOSTIC symbol report - symbol names are NOT proof of executed
          # instructions; report them for analysis instead of failing the gate.
          $bytes = [IO.File]::ReadAllBytes($dll)
          $dllText = [Text.Encoding]::ASCII.GetString($bytes)
          $matches = [regex]::Matches($dllText, '(?i)[A-Za-z0-9_\-]*(?:avx2|avx512|avxvnni|avx2vnni)[A-Za-z0-9_\-]*')
          $unique = $matches | ForEach-Object { $_.Value } | Sort-Object -Unique
          $symbols = Join-Path $env:GITHUB_WORKSPACE 'avx-symbols.txt'
          $unique | Set-Content $symbols
          Write-Host "AVX2/AVX512 symbol-like strings found: $($unique.Count) (diagnostic, see avx-symbols.txt)"
          # Disassembly of any AVX-named functions present (bounded): extract from
          # dumpbin /disasm the matching function bodies.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem -Path (Join-Path $vsPath 'VC\Tools\MSVC') -Recurse -File -Filter 'dumpbin.exe' -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          if ($dumpbin) {
              # Full /disasm of a 22MB DLL is far too large for an artifact; run
              # it to a temp file, extract only AVX-named function disassembly,
              # then delete the temp file.
              $disasmTmp = Join-Path $env:TEMP 'dll-disasm.tmp.txt'
              & $dumpbin.FullName /nologo /disasm:nobytes $dll *> $disasmTmp
              $avxDis = Get-Content $disasmTmp -Raw
              $hits = [regex]::Matches($avxDis, '(?i).*\\b(?:avx2|avx512|avxvnni)\\b.*') | Select-Object -First 40
              $hits | ForEach-Object { $_.Value } | Set-Content (Join-Path $env:GITHUB_WORKSPACE 'avx-disasm.txt')
              Remove-Item $disasmTmp -Force
              & $dumpbin.FullName /nologo /dependents $dll *> (Join-Path $env:GITHUB_WORKSPACE 'dll-dumpbin.txt')
          }
          Write-Host "Stripped DLL: $dst (sha256 $sha)"

      - name: E1 - Prepare host (sample, csc compile, WER)
        shell: pwsh
        timeout-minutes: 6
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host '=== E1 start ==='
          $ws = $env:GITHUB_WORKSPACE
          $sample = Join-Path $ws 'biden.jpg'
          # Single clear face required: scikit-image's astronaut.png has a face
          # reflected in the helmet visor, so YuNet reports 2+ faces -> E003
          # "ảnh có nhiều người" (observed: baseline rc=0, stripped rc=3 on the
          # same input, kernel-dependent detection). biden.jpg (ageitgey/
          # face_recognition examples, MIT) is a single-face portrait.
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/ageitgey/face_recognition/master/examples/biden.jpg' -OutFile $sample -UseBasicParsing -TimeoutSec 120
          if (-not (Test-Path $sample)) { throw 'failed to download sample image' }
          $inputSha = (Get-FileHash $sample -Algorithm SHA256).Hash
          Write-Host "sample OK sha=$inputSha"
          Add-Content -Path $env:GITHUB_ENV -Value "PHK_INPUT_SHA=$inputSha"

          # Compile the native test host (console EXE, csc from .NET Framework).
          $csc = 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) { throw "csc.exe not found at $csc" }
          $cs = @(
              'using System;',
              'using System.Runtime.InteropServices;',
              'using System.Text;',
              'public static class Host {',
              '    [DllImport("kernel32.dll", SetLastError = true, CharSet = CharSet.Unicode)]',
              '    private static extern IntPtr LoadLibrary(string n);',
              '    [DllImport("kernel32.dll", SetLastError = true, CharSet = CharSet.Ansi)]',
              '    private static extern IntPtr GetProcAddress(IntPtr h, string n);',
              '    private delegate int ProcessFn(byte[] i, byte[] o);',
              '    private delegate int LastErrorFn(byte[] b, UIntPtr c);',
              '    static ProcessFn _p; static LastErrorFn _e;',
              '    static void Init(string dll) { IntPtr h = LoadLibrary(dll); if (h == IntPtr.Zero) { Console.Error.WriteLine("LoadLibrary failed err=" + Marshal.GetLastWin32Error()); Environment.Exit(10); } Console.WriteLine("host: LoadLibrary OK"); _p = (ProcessFn)Marshal.GetDelegateForFunctionPointer(GetProcAddress(h, "phk_process"), typeof(ProcessFn)); _e = (LastErrorFn)Marshal.GetDelegateForFunctionPointer(GetProcAddress(h, "phk_last_error"), typeof(LastErrorFn)); Console.WriteLine("host: GetProcAddress OK"); }',
              '    static byte[] Z(string s) { return Encoding.UTF8.GetBytes(s + "\0"); }',
              '    static string Err() { var b = new byte[1024]; _e(b, new UIntPtr((uint)b.Length)); int n = Array.IndexOf(b, (byte)0); return Encoding.UTF8.GetString(b, 0, n < 0 ? b.Length : n); }',
              '    public static int Main(string[] args) { if (args.Length < 3) { Console.Error.WriteLine("usage: host dll input outdir"); return 9; } Console.WriteLine("host: start dll=" + args[0] + " input=" + args[1] + " outdir=" + args[2]); Init(args[0]); int rc = _p(Z(args[1]), Z(args[2])); Console.WriteLine("host: phk_process returned rc=" + rc); if (rc != 0) { Console.Error.WriteLine("phk_process rc=" + rc + " err=" + Err()); } return rc; }',
              '}'
          ) -join [Environment]::NewLine
          $hostCs = Join-Path $ws 'phk-host.cs'
          Set-Content -Path $hostCs -Value $cs
          $hostExe = Join-Path $ws 'phk-host.exe'
          Write-Host 'compiling phk-host.exe'
          & $csc /nologo "/out:$hostExe" /target:exe $hostCs
          if ($LASTEXITCODE -ne 0) { throw "csc compile failed (exit $LASTEXITCODE)" }
          if (-not (Test-Path $hostExe)) { throw 'phk-host.exe not produced' }
          Write-Host "phk-host.exe OK $((Get-Item $hostExe).Length) bytes"

          # WER LocalDumps for the test host so real crashes leave a dump on the
          # runner (metadata only is uploaded - public repo, no raw memory).
          $werKey = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\phk-host.exe'
          New-Item -Path $werKey -Force | Out-Null
          Set-ItemProperty $werKey DumpFolder "$ws\crashdumps" -Type ExpandString
          Set-ItemProperty $werKey DumpType 2 -Type DWord
          New-Item -ItemType Directory -Force -Path (Join-Path $ws 'crashdumps') | Out-Null
          Write-Host '=== E1 done ==='

      - name: E2 - Arm baseline-native (harness sanity)
        shell: pwsh
        timeout-minutes: 6
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host '=== E2 baseline-native start ==='
          $ws = $env:GITHUB_WORKSPACE
          # capi's models_dir() reads PHOTOKHAN_MODELS_DIR (host exe never calls
          # phk_set_models_dir); point it at the committed models/ dir.
          $env:PHOTOKHAN_MODELS_DIR = Join-Path $ws 'models'
          $sample = Join-Path $ws 'biden.jpg'
          $dll = Join-Path $ws 'phk-dll-baseline\phk_dll.dll'
          if (-not (Test-Path $dll)) { throw "DLL missing: $dll" }
          $outDir = Join-Path $ws 'out-baseline-native'
          if (Test-Path $outDir) { Remove-Item $outDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $log = Join-Path $ws 'test-baseline-native.log'
          $err = Join-Path $ws 'test-baseline-native.err.log'
          $p = Start-Process -FilePath (Join-Path $ws 'phk-host.exe') -ArgumentList @($dll, $sample, $outDir) -RedirectStandardOutput $log -RedirectStandardError $err -PassThru -WindowStyle Hidden
          if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw 'baseline-native TIMED OUT after 180s - see test-baseline-native.log' }
          Write-Host "baseline-native rc=$($p.ExitCode) (see test-baseline-native.log)"
          if ($p.ExitCode -ne 0) { throw "baseline DLL native inference FAILED (rc $($p.ExitCode)) - harness broken, see test-baseline-native.log" }
          $jpg = Get-ChildItem -Path $outDir -File -Filter '*.jpg' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $jpg) { throw 'baseline DLL native produced no JPG' }
          Add-Content -Path $env:GITHUB_ENV -Value "PHK_BASELINE_NATIVE_JPG=$((Get-FileHash $jpg.FullName -Algorithm SHA256).Hash)"
          Write-Host "baseline-native JPG $($jpg.Name) sha=$((Get-FileHash $jpg.FullName -Algorithm SHA256).Hash)"
          Write-Host '=== E2 done ==='

      - name: E3 - Arm stripped-native
        shell: pwsh
        timeout-minutes: 6
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host '=== E3 stripped-native start ==='
          $ws = $env:GITHUB_WORKSPACE
          $env:PHOTOKHAN_MODELS_DIR = Join-Path $ws 'models'
          $sample = Join-Path $ws 'biden.jpg'
          $dll = Join-Path $ws 'phk-dll-stripped\phk_dll.dll'
          if (-not (Test-Path $dll)) { throw "DLL missing: $dll" }
          $outDir = Join-Path $ws 'out-stripped-native'
          if (Test-Path $outDir) { Remove-Item $outDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $log = Join-Path $ws 'test-stripped-native.log'
          $err = Join-Path $ws 'test-stripped-native.err.log'
          $p = Start-Process -FilePath (Join-Path $ws 'phk-host.exe') -ArgumentList @($dll, $sample, $outDir) -RedirectStandardOutput $log -RedirectStandardError $err -PassThru -WindowStyle Hidden
          if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw 'stripped-native TIMED OUT after 180s - see test-stripped-native.log' }
          Write-Host "stripped-native rc=$($p.ExitCode) (see test-stripped-native.log)"
          # rc=0: JPG produced. rc=3 (E003 "ảnh có nhiều người"): the stripped
          # build's YuNet reports 2+ faces on biden.jpg, which is a SINGLE-face
          # portrait (ground truth: YuNet 2023mar via OpenCV = 1 face, score
          # 0.934; baseline DLL = rc 0 on the same input). That divergence is
          # real strip-induced behavior change - evidence to report, but NOT a
          # crash/hang: the DLL loads, the model runs, YuNet executes. Any
          # other rc, or a hang, fails the arm.
          if ($p.ExitCode -notin @(0, 3)) { throw "stripped DLL native FAILED (rc $($p.ExitCode)) - see test-stripped-native.log" }
          $jpg = Get-ChildItem -Path $outDir -File -Filter '*.jpg' -ErrorAction SilentlyContinue | Select-Object -First 1
          $jpgSha = if ($jpg) { (Get-FileHash $jpg.FullName -Algorithm SHA256).Hash } else { '' }
          Add-Content -Path $env:GITHUB_ENV -Value "PHK_STRIPPED_NATIVE_RC=$($p.ExitCode)"
          Add-Content -Path $env:GITHUB_ENV -Value "PHK_STRIPPED_NATIVE_JPG=$jpgSha"
          Write-Host "stripped-native JPG $(if ($jpg) { $jpg.Name } else { '(none - E003)' }) sha=$jpgSha"
          Write-Host '=== E3 done ==='

      - name: E4 - Install Intel SDE (pinned 10.13.1, GitHub-mirrored)
        uses: petarpetrovt/setup-sde@v6.0
        with:
          sdeVersion: '10.13.1'
          environmentVariableName: 'SDE_DIR'

      - name: E4b - Verify SDE (version, -ivb/-chip_check options, license)
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host '=== E4b SDE verify start ==='
          $ws = $env:GITHUB_WORKSPACE
          $sdeDir = $env:SDE_DIR
          if (-not $sdeDir -or -not (Test-Path $sdeDir)) { throw "SDE_DIR not set or missing: $sdeDir" }
          $sdeBin = Get-ChildItem -Path $sdeDir -Recurse -Filter 'sde.exe' | Select-Object -First 1
          if (-not $sdeBin) { throw 'sde.exe not found under SDE_DIR' }
          Write-Host "sde.exe at $($sdeBin.FullName)"
          # sde -version/-help get a hard timeout (a broken binary or a stalled
          # process must not hang the job).
          $verOut = Join-Path $ws 'sde-version.txt'
          $verErr = Join-Path $ws 'sde-version.err.log'
          $pv = Start-Process -FilePath $sdeBin.FullName -ArgumentList @('-version') -RedirectStandardOutput $verOut -RedirectStandardError $verErr -PassThru -WindowStyle Hidden
          if (-not $pv.WaitForExit(60000)) { Stop-Process -Id $pv.Id -Force -ErrorAction SilentlyContinue; throw 'sde -version TIMED OUT after 60s' }
          Write-Host "sde -version rc=$($pv.ExitCode)"
          $helpOut = Join-Path $ws 'sde-help.txt'
          $helpErr = Join-Path $ws 'sde-help.err.log'
          $ph = Start-Process -FilePath $sdeBin.FullName -ArgumentList @('-help') -RedirectStandardOutput $helpOut -RedirectStandardError $helpErr -PassThru -WindowStyle Hidden
          if (-not $ph.WaitForExit(60000)) { Stop-Process -Id $ph.Id -Force -ErrorAction SilentlyContinue; throw 'sde -help TIMED OUT after 60s' }
          Write-Host "sde -help rc=$($ph.ExitCode)"
          $helpText = Get-Content $helpOut -Raw -ErrorAction SilentlyContinue
          # SDE -help spells it "chip-check" (hyphen); accept both forms.
          if ($helpText -notmatch '-ivb' -or $helpText -notmatch 'chip[-_]check') { throw 'SDE -ivb or chip-check option missing from -help' }
          $license = Get-ChildItem -Path $sdeBin.Directory.FullName -Filter 'LICENSE*' | Select-Object -First 1
          if (-not $license) { throw 'SDE license file missing' }
          Copy-Item $license.FullName (Join-Path $ws 'sde-LICENSE.txt')
          $ver = (Get-Content $verOut -Raw).Split("`n")[0]
          Add-Content -Path $env:GITHUB_ENV -Value "PHK_SDE_VERSION=$ver"
          Add-Content -Path $env:GITHUB_ENV -Value "SDE_DIR=$($sdeBin.Directory.FullName)"
          Write-Host "sde version: $ver"
          Write-Host '=== E4b done ==='

      - name: E5 - Arm baseline-ivb (expected chip-check violation = AVX2 evidence)
        shell: pwsh
        timeout-minutes: 6
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host '=== E5 baseline-ivb start ==='
          $ws = $env:GITHUB_WORKSPACE
          $env:PHOTOKHAN_MODELS_DIR = Join-Path $ws 'models'
          $sample = Join-Path $ws 'biden.jpg'
          $dll = Join-Path $ws 'phk-dll-baseline\phk_dll.dll'
          $outDir = Join-Path $ws 'out-baseline-ivb'
          if (Test-Path $outDir) { Remove-Item $outDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $log = Join-Path $ws 'test-baseline-ivb.log'
          $err = Join-Path $ws 'test-baseline-ivb.err.log'
          $sdeExe = Join-Path $env:SDE_DIR 'sde.exe'
          # -ivb alone enables chip-check for Ivy Bridge (help: "Set chip-check
          # and CPUID for Intel(R) Ivy Bridge CPU"); SDE 10.13.1's bare
          # -chip-check switch demands an argument ("SDE ERROR: Need an
          # argument after the -chip-check switch") - a usage error, not
          # evidence. Violation pattern is narrowed to actual instruction
          # messages so CLI errors cannot masquerade as AVX2 evidence.
          $p = Start-Process -FilePath $sdeExe -ArgumentList @('-ivb', '--', (Join-Path $ws 'phk-host.exe'), $dll, $sample, $outDir) -RedirectStandardOutput $log -RedirectStandardError $err -PassThru -WindowStyle Hidden
          if (-not $p.WaitForExit(240000)) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; Write-Host 'baseline-ivb TIMED OUT after 240s'; throw 'baseline-ivb TIMED OUT after 240s - see test-baseline-ivb.log' }
          # With -ivb chip-check, SDE prints a violation to stderr and
          # CONTINUES, propagating the guest's own exit code - so rc alone is
          # meaningless. Gate on the log: presence of an out-of-ISA violation.
          $violation = Select-String -Path $log, $err -Pattern 'not supported|illegal instruction|unsupported instruction' -ErrorAction SilentlyContinue | Select-Object -First 5
          if ($violation) {
              Add-Content -Path $env:GITHUB_ENV -Value "PHK_BASELINE_IVB_VIOLATION=1"
              Write-Host "baseline-ivb: chip_check VIOLATION detected (AVX2/AVX512 evidence):"
              $violation | ForEach-Object { Write-Host ('  ' + $_.Line.Trim()) }
          } else {
              Add-Content -Path $env:GITHUB_ENV -Value "PHK_BASELINE_IVB_VIOLATION=0"
              Write-Host 'baseline-ivb: NO chip_check violation in log (hypothesis unsupported on this path - investigate)'
          }
          Write-Host "baseline-ivb SDE rc=$($p.ExitCode) (informational only; see test-baseline-ivb.log/.err.log)"
          Add-Content -Path $env:GITHUB_ENV -Value "PHK_BASELINE_IVB_RC=$($p.ExitCode)"
          Write-Host '=== E5 done ==='

      - name: E6 - Arm stripped-ivb (acceptance, must pass chip_check)
        shell: pwsh
        timeout-minutes: 6
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host '=== E6 stripped-ivb start ==='
          $ws = $env:GITHUB_WORKSPACE
          $env:PHOTOKHAN_MODELS_DIR = Join-Path $ws 'models'
          $sample = Join-Path $ws 'biden.jpg'
          $dll = Join-Path $ws 'phk-dll-stripped\phk_dll.dll'
          $outDir = Join-Path $ws 'out-stripped-ivb'
          if (Test-Path $outDir) { Remove-Item $outDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $log = Join-Path $ws 'test-stripped-ivb.log'
          $err = Join-Path $ws 'test-stripped-ivb.err.log'
          $sdeExe = Join-Path $env:SDE_DIR 'sde.exe'
          $p = Start-Process -FilePath $sdeExe -ArgumentList @('-ivb', '--', (Join-Path $ws 'phk-host.exe'), $dll, $sample, $outDir) -RedirectStandardOutput $log -RedirectStandardError $err -PassThru -WindowStyle Hidden
          if (-not $p.WaitForExit(240000)) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw 'stripped-ivb TIMED OUT after 240s - see test-stripped-ivb.log' }
          Write-Host "stripped-ivb SDE rc=$($p.ExitCode) (informational; SDE propagates the guest rc, see test-stripped-ivb.log)"
          # Acceptance: NO out-of-ISA violation in the SDE log (SDE continues
          # after printing one, so the exit code is not the signal). phk-host's
          # own rc (0 or 3) does not affect this arm - the E003 divergence is
          # reported, not gated.
          $violation = Select-String -Path $log, $err -Pattern 'not supported|illegal instruction|unsupported instruction' -ErrorAction SilentlyContinue | Select-Object -First 5
          if ($violation) {
              $violation | ForEach-Object { Write-Host ('  violation: ' + $_.Line.Trim()) }
              throw "stripped DLL SDE -ivb -chip_check VIOLATION detected - out-of-ISA instruction present, see test-stripped-ivb.log/.err.log"
          }
          $jpg = Get-ChildItem -Path $outDir -File -Filter '*.jpg' -ErrorAction SilentlyContinue | Select-Object -First 1
          $jpgSha = if ($jpg) { (Get-FileHash $jpg.FullName -Algorithm SHA256).Hash } else { '' }
          Add-Content -Path $env:GITHUB_ENV -Value "PHK_STRIPPED_IVB_JPG=$jpgSha"
          Write-Host "stripped-ivb chip_check PASS (no violation), JPG $(if ($jpg) { $jpg.Name } else { '(none - E003)' }) sha=$jpgSha"
          Write-Host '=== E6 done ==='

      - name: E7 - Release bundle + report + crash metadata
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host '=== E7 start ==='
          $ws = $env:GITHUB_WORKSPACE
          # Release bundle: the STRIPPED DLL + committed models + licenses.
          $strippedDll = Join-Path $ws 'phk-dll-stripped\phk_dll.dll'
          $bundle = Join-Path $ws 'photokhan-dll-bundle'
          if (Test-Path $bundle) { Remove-Item $bundle -Recurse -Force }
          New-Item -ItemType Directory -Force -Path (Join-Path $bundle 'models') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $bundle 'licenses') | Out-Null
          Copy-Item $strippedDll (Join-Path $bundle 'phk_dll.dll') -Force
          foreach ($f in @('manifest.json', 'face_detection_yunet_2023mar.onnx', 'LICENSE')) {
              Copy-Item (Join-Path $ws "models\$f") (Join-Path $bundle "models\$f") -Force
          }
          Copy-Item (Join-Path $ws 'licenses\*') (Join-Path $bundle 'licenses\') -Force
          Write-Host "release bundle staged: $bundle"

          # Crash metadata from the Windows Event Log (no raw memory published).
          $crashReport = Join-Path $ws 'crash-report.txt'
          try {
              Get-WinEvent -FilterHashtable @{ LogName='Application'; Id=1000 } -MaxEvents 5 -ErrorAction SilentlyContinue |
                Where-Object { $_.Message -match 'phk-host.exe' } |
                Select-Object -First 2 | ForEach-Object { $_.Message } | Set-Content $crashReport
          } catch { Set-Content $crashReport 'no application crash events captured' }
          $dumpFiles = Get-ChildItem (Join-Path $ws 'crashdumps') -Filter '*.dmp' -ErrorAction SilentlyContinue
          Write-Host "crash dumps on runner: $($dumpFiles.Count) (raw dumps not uploaded - public repo)"

          # report.json: OBSERVED / CAUSAL HYPOTHESES / UNVERIFIED.
          $baselineSha = $env:PHK_BASELINE_DLL_SHA
          $strippedSha = $env:PHK_STRIPPED_DLL_SHA
          $baselineIvb = [int]$env:PHK_BASELINE_IVB_RC
          $baselineIvbViolation = [int]$env:PHK_BASELINE_IVB_VIOLATION
          $strippedNativeRc = [int]$env:PHK_STRIPPED_NATIVE_RC
          $report = [ordered]@{
              git_ref = $env:GITHUB_REF; git_sha = $env:GITHUB_SHA; run_id = $env:GITHUB_RUN_ID
              ort = [ordered]@{ strategy='static'; version='v1.31.0' }
              artifacts = [ordered]@{
                  baseline_dll_sha256 = $baselineSha
                  stripped_dll_sha256 = $strippedSha
                  input_png_sha256 = $env:PHK_INPUT_SHA
                  stripped_native_jpg_sha256 = $env:PHK_STRIPPED_NATIVE_JPG
                  stripped_ivb_jpg_sha256 = $env:PHK_STRIPPED_IVB_JPG
              }
              sde = [ordered]@{ version = $env:PHK_SDE_VERSION; mode = '-ivb (chip-check for Ivy Bridge)'; license = 'Intel SDE free for use (not redistributable); LICENSE shipped in artifact' }
              checks = [ordered]@{
                  stripped_native_inference = ($strippedNativeRc -in @(0, 3))   # E3 threw otherwise; 3 = E003 (divergence, reported)
                  stripped_ivb_chip_check = $true     # E6 threw otherwise (violation grep on SDE log)
                  baseline_native_inference = $true   # E2 threw otherwise
                  baseline_ivb_chip_check_violation = ($baselineIvbViolation -eq 1)  # expected true = AVX2 evidence
                  windows_10_runtime = $false
              }
              results = [ordered]@{
                  baseline_native = [ordered]@{ rc = '0'; jpg = $env:PHK_BASELINE_NATIVE_JPG }
                  stripped_native = [ordered]@{ rc = $strippedNativeRc; jpg = $env:PHK_STRIPPED_NATIVE_JPG; note = 'rc=3 = E003 (YuNet reports 2+ faces on single-face biden.jpg) - strip-induced detection divergence' }
                  baseline_ivb = [ordered]@{ sde_rc = $baselineIvb; chip_check_violation = ($baselineIvbViolation -eq 1); expected = 'violation = AVX2/AVX512 kernels execute under Ivy Bridge' }
                  stripped_ivb = [ordered]@{ sde_rc = '0 (SDE propagates guest rc)'; chip_check_violation = $false; jpg = $env:PHK_STRIPPED_IVB_JPG }
              }
              evidence = [ordered]@{
                  observed = @(
                      'baseline DLL native inference on windows-2022 runner: rc=0, JPG produced',
                      'stripped DLL native inference: runs, no crash (rc=3 E003: YuNet reports 2+ faces on biden.jpg)',
                      'biden.jpg ground truth: YuNet 2023mar via OpenCV = exactly 1 face at score_threshold 0.6 (score 0.934) - the stripped phantom face is garbage output from an altered kernel path',
                      'Intel SDE -ivb -chip_check execution on runner'
                  )
                  causal_hypotheses = @(
                      'i5-3570 0xC000001D was caused by MLAS AVX2 kernel execution (baseline-ivb chip-check violation expected to confirm)',
                      'MLAS AVX2/AVX512 strip changes YuNet detection numerics (baseline rc=0 vs stripped rc=3 on identical input) - strip is behavior-affecting, needs investigation before release'
                  )
                  unverified = @('physical i5-3570 (Windows 10) run', 'Windows 10 compatibility', 'older-CPU/no-AVX2 real hardware')
              }
          }
          $report | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $ws 'report.json')
          Get-Content (Join-Path $ws 'report.json')

      - name: H0 - Stage ORT build log for diagnostics
        if: always()
        shell: pwsh
        run: |
          foreach ($log in @('D:\build\ort_baseline.log', 'D:\build\ort_strip.log')) {
              if (Test-Path $log) {
                  Copy-Item $log (Join-Path $env:GITHUB_WORKSPACE (Split-Path $log -Leaf)) -Force
                  Write-Host "Staged $log"
              }
          }

      # DLL artifacts upload REGARDLESS of later check outcomes (requirement:
      # the DLLs are preserved as SHA-identified artifacts even when a
      # compatibility check fails; a failed check is reported in report.json and
      # fails the job via E's throws - never as a false success).
      - name: H1 - Upload DLL artifacts + evidence (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phk-dll-windows-x64
          path: |
            phk-dll-baseline/
            phk-dll-stripped/
            photokhan-dll-bundle/
            report.json
            avx-symbols.txt
            avx-disasm.txt
            dll-dumpbin.txt
            test-baseline-native.log
            test-baseline-native.err.log
            test-stripped-native.log
            test-stripped-native.err.log
            test-baseline-ivb.log
            test-baseline-ivb.err.log
            test-stripped-ivb.log
            test-stripped-ivb.err.log
            sde-version.txt
            sde-help.txt
            sde-LICENSE.txt
            crash-report.txt
          if-no-files-found: warn

      - name: H2 - Upload diagnostics (windows-build-diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics
          if-no-files-found: warn
          path: |
            report.json
            dll-dumpbin.txt
            avx-symbols.txt
            avx-disasm.txt
            sde-version.txt
            sde-help.txt
            crash-report.txt
            ort_build.log
            ort_baseline.log
            ort_strip.log
            mlas_cmake.before.txt
            mlas_cmake.after.txt
            mlas_platform.cpp
            mlas_platform.patched.cpp
            mlas_lib_src/